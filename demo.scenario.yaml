# Сценарий демо для README: главная → каталог → страница тайтла.
# Запись: repokit capture run --scenario demo.scenario.yaml
# Нужен заполненный .env (TMDB_API_KEY). Состав каталога приходит из TMDB и меняется со временем.
schemaVersion: 1
name: encelada-demo
baseUrl: http://localhost:3000
start:
  command: npm start
  readyUrl: /
  timeoutSec: 60
viewport:
  width: 1280
  height: 720
  deviceScaleFactor: 2
steps:
  - goto: /
  - wait: 2.5
  - mark: home
  - scroll: { by: 640 }
  - wait: 1.5
  - click: "a:has-text('Подробнее')"
  - wait: 3
  - mark: details
  - scroll: { by: 520 }
  - wait: 1.6
